name: Deploy to HestiaCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to HestiaCP Server
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create deployment archive
        run: |
          mkdir -p deployment
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='node_modules' \
                    --exclude='tests' \
                    --exclude='.env.example' \
                    --exclude='phpunit.xml' \
                    --exclude='deployment' \
                    --exclude='storage/logs/*' \
                    --exclude='storage/framework/cache/*' \
                    --exclude='storage/framework/sessions/*' \
                    --exclude='storage/framework/views/*' \
                    ./ deployment/
          cd deployment && tar -czf ../deploy.tar.gz .

      - name: Deploy to HestiaCP via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HESTIACP_HOST }}
          username: ${{ secrets.HESTIACP_USERNAME }}
          key: ${{ secrets.HESTIACP_SSH_KEY }}
          port: ${{ secrets.HESTIACP_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"

      - name: Extract and setup application on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HESTIACP_HOST }}
          username: ${{ secrets.HESTIACP_USERNAME }}
          key: ${{ secrets.HESTIACP_SSH_KEY }}
          port: ${{ secrets.HESTIACP_PORT || 22 }}
          script: |
            # Set variables
            APP_DIR="${{ secrets.HESTIACP_APP_DIR }}"
            BACKUP_DIR="${APP_DIR}_backup_$(date +%Y%m%d_%H%M%S)"
            
            # Create backup of current deployment
            if [ -d "$APP_DIR" ]; then
              echo "Creating backup..."
              cp -r "$APP_DIR" "$BACKUP_DIR"
            fi
            
            # Create app directory if it doesn't exist
            mkdir -p "$APP_DIR"
            
            # Extract new deployment
            echo "Extracting files..."
            tar -xzf /tmp/deploy.tar.gz -C "$APP_DIR"
            
            # Set proper permissions
            cd "$APP_DIR"
            chmod -R 755 storage bootstrap/cache
            
            # Copy .env file if it doesn't exist (preserve existing)
            if [ ! -f .env ]; then
              echo "Warning: .env file not found. Please create one manually."
            fi
            
            # Run Laravel optimization commands
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Run migrations (optional - comment out if not needed)
            # php artisan migrate --force
            
            # Clean up
            rm -f /tmp/deploy.tar.gz
            
            echo "Deployment completed successfully!"

      - name: Deployment notification
        if: success()
        run: echo "✅ Deployment to HestiaCP completed successfully!"

      - name: Deployment failed notification
        if: failure()
        run: echo "❌ Deployment to HestiaCP failed. Please check the logs."
